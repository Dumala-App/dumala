name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, tests, build, and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production application
        run: |
          npm run clean
          npm run build

      - name: Verify PWA output and cache policy
        run: npm run verify:pwa

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dumala-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
