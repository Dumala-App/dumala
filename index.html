<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="application-name" content="Dumala" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dumala" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      (function () {
        var isPlayerRoute = /^#\/?player(?:[/?]|$)/.test(window.location.hash);
        var manifestHref = isPlayerRoute ? '/player-manifest.webmanifest' : '/manifest.webmanifest';
        var appleIconHref = isPlayerRoute ? '/dumala-player-pwa-192.png' : '/dumala-pwa-192.png';
        var appName = isPlayerRoute ? 'Dumala Player' : 'Dumala';
        document.querySelector('meta[name="application-name"]').setAttribute('content', appName);
        document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', appName);
        document.write('<link id="dumala-web-manifest" rel="manifest" href="' + manifestHref + '" />');
        document.write('<link id="dumala-apple-touch-icon" rel="apple-touch-icon" sizes="192x192" href="' + appleIconHref + '" />');
      }());
    </script>
    <link rel="preload" href="/fonts/dm-sans/dm-sans-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope/manrope-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" href="/dumala-browser-logo.png" />
    <meta name="description" content="A data-driven football team management platform built for coaches." />
    <meta property="og:title" content="Dumala" />
    <meta property="og:description" content="A data-driven football team management platform built for coaches." />
    <meta property="og:image" content="https://dumala.asia/Dumala_logo.png" />
    <meta property="og:url" content="https://dumala.asia/" />
    <meta property="og:type" content="website" />
    <title>Dumala</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
